<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NIGHT RUN</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;
       font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#2bb83f}
  #wrap{position:relative;width:min(100vw,calc((100vh - 34px)*4/3));aspect-ratio:4/3}
  #c{width:100%;height:100%;display:block;cursor:pointer;
     image-rendering:-moz-crisp-edges;image-rendering:crisp-edges;image-rendering:pixelated}
  #wrap.scan::after{content:"";position:absolute;inset:0;pointer-events:none;
     background:repeating-linear-gradient(to bottom,rgba(0,0,0,.22) 0,rgba(0,0,0,.22) 1px,transparent 1px,transparent 3px)}
  #hint{height:34px;line-height:34px;font-size:10px;letter-spacing:.1em;opacity:.8;white-space:nowrap}
  #hint b{color:#58ff6a;font-weight:normal}
  #vstat{position:absolute;left:6px;top:6px;z-index:2;pointer-events:none;max-width:100%;
        font-size:11px;letter-spacing:.1em;color:#58ff6a;text-shadow:1px 1px 0 #000,0 0 4px #000}
  #vstat a{pointer-events:auto;color:#ffd23a}
</style>
</head>
<body>
<div id="wrap" class="scan"><canvas id="c" width="320" height="240"></canvas></div>
<div id="hint"><b>SPACE</b> pause &nbsp;·&nbsp; <b>U</b> mph/km/h &nbsp;·&nbsp; <b>C</b> palette &nbsp;·&nbsp; <b>S</b> scanlines &nbsp;·&nbsp; <b>R</b> new world &nbsp;·&nbsp; <b>M</b> auto/manual &nbsp;·&nbsp; <b>↑↓←→</b> drive &nbsp;·&nbsp; <b>T</b> time &nbsp;·&nbsp; <b>W</b> weather</div>

<script>
(() => {
'use strict';

/* ================================================================
   NIGHT RUN — an auto-driving 8-bit highway
   Internal resolution 320x240, scaled up with crisp pixels.
   ================================================================ */

const W = 320, H = 240, CX = W/2;
const H0 = 100;          // horizon row
const YB = 187;          // last road row (dash starts below)
const DASH_Y = 188;
const K = 540;           // depth constant:  d = K / (y - H0)
const F = 120;           // focal length in px (sprite scale = F / d)
const LPK = 0.822;       // lane width in px per (y - H0)   (3.7 m lane)
let KMAX = 1.5e-3;       // max road curvature (lanes / m^2)   [?curves]
let VMAX = 100;          // m/s at full speed bar (= 224 mph)   [?speed]
let MAXEXTRA = 3;        // max extra lanes a+b (0..3)          [?lanes]
const SMIN = -3, SMAX = 4;
const SKY_W = W*2;

const cv = document.getElementById('c');
const wrap = document.getElementById('wrap');
const ctx = cv.getContext('2d', { alpha: false });
ctx.imageSmoothingEnabled = false;

/* ---------------- palettes ---------------- */
const THEMES = [
  { hi:'#58ff6a', mid:'#2bb83f', dim:'#145e24', dark:'#0b3315', warn:'#ffd23a', hot:'#ff4b3a' },
  { hi:'#ffc43a', mid:'#d98a14', dim:'#7a4a0a', dark:'#3a2205', warn:'#ff7a2a', hot:'#ff3b2a' },
  { hi:'#6ff3ff', mid:'#2fb6d0', dim:'#14607a', dark:'#082e3a', warn:'#ffd23a', hot:'#ff4b6a' },
];
let themeIdx = 0, P = THEMES[0];
const CAR_COLORS = ['#ff55dd','#5a78ff','#33e6ff','#ffd23a','#ff8a2a','#b8ff5a','#e6f0e6','#c05aff'];

/* ---------------- tiny helpers ---------------- */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const clamp = (x,a,b) => x<a?a:x>b?b:x;
const clamp01 = x => x<0?0:x>1?1:x;

let lastFill = '';
function R(x,y,w,h,c){
  const x0=Math.round(x), y0=Math.round(y);
  let x1=Math.round(x+w), y1=Math.round(y+h);
  if(x1<=x0) x1=x0+1; if(y1<=y0) y1=y0+1;
  if(x1<0||x0>=W||y1<0||y0>=H) return;
  if(c!==lastFill){ ctx.fillStyle=c; lastFill=c; }
  ctx.fillRect(x0,y0,x1-x0,y1-y0);
}
function line(x0,y0,x1,y1,c){
  x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
  const dx=Math.abs(x1-x0), dy=-Math.abs(y1-y0), sx=x0<x1?1:-1, sy=y0<y1?1:-1;
  let err=dx+dy, n=0;
  for(;;){
    R(x0,y0,1,1,c);
    if((x0===x1&&y0===y1)||++n>1200) break;
    const e2=2*err;
    if(e2>=dy){ err+=dy; x0+=sx; }
    if(e2<=dx){ err+=dx; y0+=sy; }
  }
}
function tline(x0,y0,x1,y1,c){ line(x0,y0,x1,y1,c); line(x0+1,y0,x1+1,y1,c); line(x0,y0+1,x1,y1+1,c); }
function fillPoly(pts,c){
  let minY=1e9,maxY=-1e9;
  for(const p of pts){ if(p[1]<minY)minY=p[1]; if(p[1]>maxY)maxY=p[1]; }
  const n=pts.length;
  for(let y=minY;y<=maxY;y++){
    const xs=[];
    for(let i=0;i<n;i++){
      const p=pts[i], q=pts[(i+1)%n];
      if((p[1]<=y&&q[1]>y)||(q[1]<=y&&p[1]>y)) xs.push(p[0]+(y-p[1])*(q[0]-p[0])/(q[1]-p[1]));
    }
    xs.sort((a,b)=>a-b);
    for(let j=0;j+1<xs.length;j+=2){
      const a=Math.round(xs[j]), b=Math.round(xs[j+1]);
      R(a,y,b-a+1,1,c);
    }
  }
}

/* ---------------- 3x5 pixel font ---------------- */
const GL = {
 '0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001',
 '5':'111100111001111','6':'111100111101111','7':'111001001010010','8':'111101111101111','9':'111101111001111',
 'A':'010101111101101','B':'110101110101110','C':'011100100100011','D':'110101101101110','E':'111100110100111',
 'F':'111100110100100','G':'011100101101011','H':'101101111101101','I':'111010010010111','J':'001001001101010',
 'K':'101101110101101','L':'100100100100111','M':'101111111101101','N':'111101101101101','O':'111101101101111',
 'P':'111101111100100','Q':'111101101111001','R':'110101110101101','S':'011100010001110','T':'111010010010010',
 'U':'101101101101111','V':'101101101101010','W':'101101111111101','X':'101101010101101','Y':'101101010010010',
 'Z':'111001010100111','.':'000000000000010',':':'000010000010000','/':'001001010100100','-':'000000111000000',
 ' ':'000000000000000','<':'001010100010001','>':'100010001010100','+':'000010111010000','!':'010010010000010'
};
function textW(s,sc=1){ return s.length*4*sc - sc; }
function drawText(str,x,y,c,sc=1){
  str=String(str).toUpperCase();
  for(let i=0;i<str.length;i++){
    const g=GL[str[i]];
    if(g){
      for(let r=0;r<5;r++){
        let q=0;
        while(q<3){
          if(g[r*3+q]==='1'){ let e=q; while(e+1<3&&g[r*3+e+1]==='1') e++; R(x+q*sc,y+r*sc,(e-q+1)*sc,sc,c); q=e+1; }
          else q++;
        }
      }
    }
    x+=4*sc;
  }
}


/* ================================================================
   WORLD — a pregenerated route of highways, country roads, suburbs,
   towns and cities, built lazily as you drive.

   Lateral coords are in lane widths. Eight "slots" (-3..4) sit side by
   side; slot 0 | slot 1 meet at lateral 0. Every slot has its own width
   polyline over z (0 = absent, 1 = full lane), so lanes can taper in/out.
     highway : slots 0,1 (+ extras -1..-3 / 2..4) all drive forward
     local   : slot 0 = ONCOMING lane, slot 2 = your lane (slot 1 closed)
   Exits collapse slot 1 and keep slot 2 as the exit lane, which becomes
   the local road; on-ramps do the reverse.
   ================================================================ */
let world, sim, cars, player;
let t=0, zc=0, camL=0, skyX=0, units='mph', paused=false, throttle=0, avgV=40, totalT=0;
let trip, arrived=false, arriveT=0, tripNo=1, skySeed=1, sky=null, seedBase=1;
let autoPilot=true, crashT=0, toastMsg='', toastT=0, steerIn=0, thrIn=0, brkIn=0, shakeT=0;
const keysDown={};


/* ---------------- query-string config ----------------
   Everything tweakable can be set from the URL, e.g.
   ?seed=42&traffic=1.5&speed=1.2&curves=0.5&lanes=2&trip=4000
     &palette=amber&units=kmh&scanlines=0&pause=1&sky=7&hint=0

   seed      world seed (int)          traffic   car density 0..4 (1 = default)
   speed     pace 0.25..3              curves    road curvature 0.05..4
   lanes     extra lanes 0..3          trip      trip length in m (0 = random)
   palette   green|amber|cyan|0-2      units     mph|kmh
   scanlines 0/1                       pause     0/1 (start paused)
   sky       skyline variant (int)     hint      0/1 (bottom key hints)
   render    seconds of video to encode fps       frames per second (dflt 60)
             as an .mp4 download, as fast     e.g. ?render=10&fps=30
             as possible (0/omitted = off)

   Only non-default values are written back to the address bar, and any
   unknown params in the URL are preserved.
   ------------------------------------------------------ */
const QS = new URLSearchParams(location.search);

// Retrieves and clamps a numeric query parameter
function qnum(key, defaultValue, min, max) {
  const parsedVal = parseFloat(QS.get(key));
  return Number.isFinite(parsedVal) ? clamp(parsedVal, min, max) : defaultValue;
}

// Retrieves a boolean flag query parameter
function qflag(key, defaultValue) {
  const rawVal = QS.get(key);
  if (rawVal === null) return defaultValue;
  if (rawVal === '') return true;                  // bare ?flag = on
  return !/^(0|false|off|no)$/i.test(rawVal);
}

// Retrieves an integer query parameter with optional default, min, and max bounds
function qint(key, defaultValue = null, min, max) {
  const rawVal = QS.get(key);
  if (rawVal === 'max') return max;
  
  const parsedInt = rawVal === null ? NaN : parseInt(rawVal, 10);
  
  // If not a valid finite number, return the fallback default
  if (!Number.isFinite(parsedInt)) return defaultValue;
  
  // Apply optional min/max bounds
  let val = parsedInt;
  if (min !== undefined) val = Math.max(min, val);
  if (max !== undefined) val = Math.min(max, val);
  return val;
}
const THEME_NAMES={ green:0, amber:1, gold:1, orange:1, cyan:2, ice:2, blue:2 };
function qtheme(){
  const v=String(QS.get('palette')!==null?QS.get('palette'):(QS.get('theme')||'')).trim().toLowerCase();
  if(!v) return 0;
  if(v in THEME_NAMES) return THEME_NAMES[v];
  const n=parseInt(v,10);
  return Number.isFinite(n)?((n%THEMES.length)+THEMES.length)%THEMES.length:0;
}
const CFG = {
  seed:    qint('seed'),
  sky:     qint('sky'),
  traffic: qnum('traffic',1,0,4),
  speed:   qnum('speed',1,0.25,3),
  curves:  qnum('curves',1,0.05,4),
  lanes:   Math.round(qnum('lanes',3,0,3)),
  trip:    Math.round(qnum('trip',0,0,1e6)),
  palette: qtheme(),
  units:   /^(kmh|km|km\/h|metric)$/i.test(QS.get('units')||'')?'kmh':'mph',
  scan:    qflag('scanlines',true),
  pause:   qflag('pause',false),
  hint:    qflag('hint',true),
  render:  qnum('render',0,0,9999999999),
  fps:     qnum('fps',60,1,240),
};
KMAX *= CFG.curves;
VMAX *= CFG.speed;
MAXEXTRA = CFG.lanes;
themeIdx = CFG.palette; P = THEMES[themeIdx];
units = CFG.units;
paused = CFG.pause;
if(!CFG.scan) wrap.classList.remove('scan');
if(!CFG.hint){
  const he=document.getElementById('hint');
  if(he) he.style.display='none';
  wrap.style.width='min(100vw,calc(100vh * 4/3))';
}
let seedPinned = CFG.seed!==null;             // keep ?seed in the URL once chosen

function syncURL(){
  const q=QS;
  const num=(k,v,d)=>{ if(v===d) q.delete(k); else q.set(k,String(v)); };
  if(seedPinned) q.set('seed',String(seedBase)); else q.delete('seed');
  num('traffic',CFG.traffic,1);
  num('speed',CFG.speed,1);
  num('curves',CFG.curves,1);
  num('lanes',CFG.lanes,3);
  num('trip',CFG.trip,0);
  num('sky',CFG.sky,null);
  // render/fps stay in the URL as-is (export params)
  if(themeIdx===0) q.delete('palette'); else q.set('palette',String(themeIdx));
  if(units==='mph') q.delete('units'); else q.set('units',units);
  if(wrap.classList.contains('scan')) q.delete('scanlines'); else q.set('scanlines','0');
  if(paused) q.set('pause','1'); else q.delete('pause');
  if(typeof ENV!=='undefined'){ if(ENV.time!=='cycle') q.set('time',ENV.time); else if(!/^[0-9.]+$/.test(q.get('time')||'x')) q.delete('time'); if(ENV.wx!=='sim') q.set('wx',ENV.wx); else q.delete('wx'); }
  if(CFG.hint) q.delete('hint'); else q.set('hint','0');
  const s=q.toString();
  try{ history.replaceState(null,'',location.pathname+(s?'?'+s:'')+location.hash); }catch(e){}
}

function evalPL(arr,z){
  let hi=arr.length-1;
  if(z>=arr[hi][0]) return arr[hi][1];
  if(z<=arr[0][0]) return arr[0][1];
  let lo=0;
  while(hi-lo>1){ const m=(lo+hi)>>1; if(arr[m][0]<=z) lo=m; else hi=m; }
  const p=arr[lo], q=arr[hi];
  return p[1]+(q[1]-p[1])*((z-p[0])/((q[0]-p[0])||1));
}


/* ---------------- name generator (syllable combos) ---------------- */
const SY1=['bel','mor','ash','tan','wick','lan','dor','fen','kes','ar','el','har','win','cal','rav','sun','pin','oak','mar','tel','bran','os','ver','lin','hol','cor','dun','gar','nor','sil','mill','cam','ber','quin','zan'];
const SY2=['a','o','i','e','an','en','on','in','er','or','el','al','ow','ew','ing'];
const SY3=['wood','brook','field','ridge','crest','stone','view','haven','mont','dale','ford','lake','hill','glen','park'];
const ST_SFX=['ST','AVE','RD','DR','LN','CT','WAY','BLVD','PL','TER'];
const TOWN_SFX=['VILLE','TON','BURG','FIELD','FORD','PORT','DALE','HAVEN','MONT','WOOD','BY','HAM'];
const pick=(r,a)=>a[(r()*a.length)|0];
function baseWord(r){
  const m=r();
  if(m<0.4) return pick(r,SY1)+pick(r,SY2);
  if(m<0.8) return pick(r,SY1)+pick(r,SY3);
  return pick(r,SY1)+pick(r,SY2)+pick(r,SY3);
}
function streetName(r){
  const q=r();
  if(q<0.14) return pick(r,['MAIN','OAK','ELM','PINE','MAPLE','CEDAR','PARK','LAKE','HILL','MILL'])+' '+pick(r,['ST','AVE','RD']);
  if(q<0.22) return String(1+((r()*60)|0))+pick(r,['TH','ND','RD'])+' '+pick(r,['ST','AVE']);
  return baseWord(r).toUpperCase()+' '+pick(r,ST_SFX);
}
function townName(r){
  const w=(r()<0.5?pick(r,SY1)+pick(r,TOWN_SFX.map(s=>s.toLowerCase())):baseWord(r)).toUpperCase();
  const q=r();
  return q<0.1?'NEW '+w:q<0.16?'PORT '+w:q<0.2?'MT '+w:w;
}
function hwyName(r){
  const q=r(), n=pick(r,[5,10,35,69,70,75,80,90,94,95,96,275,696]);
  return (q<0.6?'I-'+n:q<0.8?'US '+(10+((r()*80)|0)):'SR '+(2+((r()*90)|0)))+' '+pick(r,['N','S','E','W']);
}
// stateless hash -> [0,1)
function hrand(a,b,c){
  let h=Math.imul(a|0,374761393)^Math.imul(b|0,668265263)^Math.imul(c|0,2147483647);
  h=Math.imul(h^(h>>>13),1274126177); h^=h>>>16;
  return (h>>>0)/4294967296;
}

/* ---------------- road types ---------------- */
const LT={
  hwy:    {lim:1.00, curv:1.0, label:'HWY'},
  country:{lim:0.42, curv:1.9, label:'ROAD'},
  sub:    {lim:0.20, curv:0.5, label:'SUBURB'},
  town:   {lim:0.24, curv:0.25,label:'TOWN'},
  city:   {lim:0.27, curv:0.2, label:'CITY'},
};
const isLocal=ty=>ty!=='hwy';
const SIG_PERIOD=30;
function sigState(x,tt){ const u=(tt+x.ph)%SIG_PERIOD; return u<15?'G':u<18?'Y':'R'; }

/* ---------------- slots ---------------- */
function evalSW(s,z){ return clamp01(evalPL(world.SW[s],z)); }
const slotW=(s,z)=>evalSW(s,z);
function slotLb(s,z){
  let x=0;
  if(s>=1){ for(let k=1;k<s;k++) x+=evalSW(k,z); return x; }
  for(let k=s;k<=0;k++) x+=evalSW(k,z);
  return -x;
}
function slotC(s,z){ return slotLb(s,z)+evalSW(s,z)/2; }
function roadEdges(z){
  let L=0,R=0;
  for(let s=SMIN;s<=0;s++) L+=evalSW(s,z);
  for(let s=1;s<=SMAX;s++) R+=evalSW(s,z);
  return [-L,R];
}
function slotMinW(s,z0,z1){
  let m=1;
  for(let i=0;i<=7;i++){ const w=evalSW(s,z0+(z1-z0)*i/7); if(w<m) m=w; }
  return m;
}
function inOnc(z){ for(const o of world.ONC) if(z>=o[0]&&z<=o[1]) return true; return false; }
function oncOverlap(z0,z1){ for(const o of world.ONC) if(o[0]<=z1&&o[1]>=z0) return true; return false; }
// can a forward-driving car use slot s for the whole of [z0,z1]?
function slotValid(s,z0,z1){
  if(slotMinW(s,z0,z1)<0.85) return false;
  if(s===0 && oncOverlap(z0,z1)) return false;
  return true;
}
// first z in [z0,z1] where forward slot s becomes unusable (Infinity = never)
function firstBadZ(s,z0,z1){
  for(let i=0;i<=24;i++){
    const z=z0+(z1-z0)*i/24;
    if(evalSW(s,z)<0.85 || (s===0&&inOnc(z))) return z;
  }
  return Infinity;
}
function limAt(z){ return evalPL(world.LIM,z); }

/* ---------------- legs ---------------- */
function legIndexAt(z){
  const L=world.legs; let lo=0,hi=L.length-1;
  if(!L.length) return -1;
  if(z<L[0].z0) return 0;
  while(lo<hi){ const m=(lo+hi+1)>>1; if(L[m].z0<=z) lo=m; else hi=m-1; }
  return lo;
}
const legAt=z=>world.legs[legIndexAt(z)];
function tripAt(z){
  for(let i=world.trips.length-1;i>=0;i--) if(world.trips[i].z0<=z) return world.trips[i];
  return world.trips[0];
}
// smooth population density 0..1 (blends across leg boundaries)
function densAt(z){
  const i=legIndexAt(z), L=world.legs[i]; if(!L) return 0.3;
  let d=L.dens;
  const nx=world.legs[i+1], pv=world.legs[i-1];
  if(nx&&L.z1-z<250) d+=(nx.dens-d)*(1-(L.z1-z)/250)*0.5;
  if(pv&&z-L.z0<250) d+=(pv.dens-d)*(1-(z-L.z0)/250)*0.5;
  return d;
}


/* ---------------- trips & legs ---------------- */
function swRamp(s,z0,z1,w1){
  const a=world.SW[s], cur=world.cur[s], cz=world.curZ[s];
  if(z0<cz) z0=cz;
  if(z1<z0+1) z1=z0+1;
  if(z0>cz) a.push([z0,cur]);
  a.push([z1,w1]); world.cur[s]=w1; world.curZ[s]=z1;
}
function limRamp(z0,z1,m){
  const a=world.LIM;
  if(z0<world.limZ) z0=world.limZ;
  if(z1<z0+1) z1=z0+1;
  if(z0>world.limZ) a.push([z0,world.limCur]);
  a.push([z1,m]); world.limCur=m; world.limZ=z1;
}
const LOCALS=['country','sub','town','city'];
function pickLocal(r,not){
  let ty; do{ ty=LOCALS[(r()*4)|0]; }while(ty===not && r()<0.85);
  return ty;
}
function makeTrip(z0){
  const r=world.rng, types=[];
  let prev=world.lastType;
  const n=3+((r()*4)|0);
  for(let i=0;i<n;i++){
    let ty=(prev==='hwy')?pickLocal(r):((r()<0.62&&i<n-1)?'hwy':pickLocal(r,prev));
    if(i===0&&world.firstHwy){ ty='hwy'; world.firstHwy=false; }
    types.push(ty); prev=ty;
  }
  if(prev==='hwy') types.push(pickLocal(r));
  const base={hwy:[2800,6000],country:[1100,2200],sub:[700,1300],town:[600,1100],city:[700,1300]};
  const lens=types.map(ty=>base[ty][0]+r()*(base[ty][1]-base[ty][0]));
  if(CFG.trip>0){
    const sum=lens.reduce((a,b)=>a+b,0);
    for(let i=0;i<lens.length;i++) lens[i]*=CFG.trip/sum;
  }
  const legs=[]; let z=z0;
  for(let i=0;i<types.length;i++){
    const ty=types[i], len=Math.max(ty==='hwy'?2000:550,lens[i]);
    const dens={hwy:0.1+r()*0.8,country:0.05+r()*0.12,sub:0.3+r()*0.15,town:0.5+r()*0.2,city:0.8+r()*0.2}[ty];
    let name,place='';
    if(ty==='hwy') name=hwyName(r);
    else if(ty==='country') name=r()<0.5?'CO RD '+(1+((r()*99)|0)):'SR '+(2+((r()*90)|0));
    else if(ty==='town'&&r()<0.5) name='MAIN ST';
    else name=streetName(r);
    if(ty==='sub'||ty==='town'||ty==='city') place=townName(r);
    legs.push({type:ty,z0:z,z1:z+len,len,dens,name,place,exitNo:1+((r()*70)|0),built:false});
    z+=len;
  }
  world.lastType=types[types.length-1];
  const last=legs[legs.length-1];
  const tr={z0,z1:z,legs,dest:last.place||last.name,no:world.trips.length+1};
  for(const L of legs){ L.trip=tr; world.legs.push(L); }
  world.trips.push(tr);
  return tr;
}
function ensureLeg(i){
  while(world.legs.length<=i){
    const L=world.legs[world.legs.length-1];
    makeTrip(L?L.z1:0);
  }
}

/* ---------------- building a leg ---------------- */
function genCurves(z0,z1,ty){
  const w=world, r=w.rng, cm=LT[ty].curv;
  let z=Math.max(w.curveZ,z0);
  for(;;){
    const zs=z+(ty==='country'?40+r()*160:80+r()*350), len=ty==='country'?120+r()*260:250+r()*450;
    if(zs+len>z1) break;
    const str=(0.35+r()*0.65)*KMAX*cm*(r()<0.5?-1:1), n=18;
    w.CV.push([zs,0]);
    for(let i=1;i<n;i++){ const u=i/n; w.CV.push([zs+len*u,str*Math.pow(Math.sin(Math.PI*u),2)]); }
    w.CV.push([zs+len,0]);
    z=zs+len;
  }
  w.curveZ=z;
}
function genHwyLanes(z0,z1,nx){
  const w=world, r=w.rng, local=nx&&isLocal(nx.type);
  const limit=local?z1-1000:z1+400;
  let cur=Math.max(w.laneZ,z0);
  for(;;){
    const zs=cur+180+r()*320, total=w.a+w.b;
    let add=total===0?true:total>=MAXEXTRA?false:r()<0.5;
    if(MAXEXTRA===0) break;
    const evs=[]; let side;
    if(add){
      side=r()<0.5?'L':'R'; evs.push([side,+1]);
      const o=side==='L'?'R':'L';
      if(r()<0.2&&(o==='L'?w.a:w.b)>0) evs.push([o,-1]);
    } else {
      const opts=[]; if(w.a>0) opts.push('L'); if(w.b>0) opts.push('R');
      side=opts[(r()*opts.length)|0]; evs.push([side,-1]);
      if(r()<0.2) evs.push([side==='L'?'R':'L',+1]);
    }
    const taps=evs.map(e=>e[1]>0?140+r()*90:190+r()*100), mt=Math.max(...taps);
    if(zs+mt>limit) break;
    evs.forEach(([sd,dl],i)=>{
      const cnt=sd==='L'?w.a:w.b;
      const slot=sd==='L'?(dl>0?-(cnt+1):-cnt):(dl>0?cnt+2:cnt+1);
      swRamp(slot,zs,zs+taps[i],dl>0?1:0);
      if(sd==='L') w.a+=dl; else w.b+=dl;
    });
    cur=zs+mt;
  }
  w.laneZ=cur;
  if(local){                       // close every extra lane before the exit
    const zz=Math.max(cur,z1-900);
    for(let k=1;k<=w.a;k++) swRamp(-k,zz,zz+220,0);
    for(let k=1;k<=w.b;k++) swRamp(k+1,zz,zz+220,0);
    w.a=0; w.b=0; w.laneZ=zz+220;
  }
}
function genIntersections(L,pv,nx){
  const w=world, r=w.rng, ty=L.type;
  if(ty==='country'&&false) return;
  const gp={country:[500,1000],sub:[110,190],town:[70,120],city:[85,140]}[ty];
  const sp={country:0,sub:0.06,town:0.55,city:0.8}[ty];
  let zi=L.z0+(pv&&pv.type==='hwy'?460:90);
  const zEnd=L.z1-(nx&&nx.type==='hwy'?380:60);
  while(zi<zEnd){
    const sig=r()<sp;
    w.INX.push({z:zi,name:streetName(r),sig,stop:!sig&&r()<(ty==='sub'?0.3:ty==='country'?0.5:0.1),ph:r()*SIG_PERIOD,ty});
    zi+=gp[0]+r()*(gp[1]-gp[0]);
  }
}
function buildLeg(i){
  const w=world, L=w.legs[i];
  ensureLeg(i+1);
  const pv=w.legs[i-1], nx=w.legs[i+1], r=w.rng, ty=L.type, z0=L.z0, z1=L.z1;
  L.built=true;
  const pop=Math.round((800+L.dens*L.dens*300000)/10)*10;
  if(pv&&pv.type==='hwy'&&isLocal(ty)){                       // ---- EXIT
    swRamp(2,z0-320,z0-90,1);                                  // exit lane widens
    swRamp(1,z0-60,z0+160,0);                                  // highway lanes pinch out
    limRamp(z0-500,z0+100,LT[ty].lim);
    w.SIGNS.push({z:z0-1200,kind:'gantry',lines:['EXIT '+L.exitNo,L.place||L.name,'1/2 MI']});
    w.SIGNS.push({z:z0-600,kind:'gantry',lines:['EXIT '+L.exitNo,L.place||L.name,'1/4 MI']});
    w.SIGNS.push({z:z0-120,kind:'board',side:1,lines:['EXIT',String(L.exitNo)]});
  } else if(pv&&isLocal(pv.type)&&ty==='hwy'){                // ---- ON-RAMP
    swRamp(1,z0-120,z0+120,1);
    swRamp(2,z0+150,z0+480,0);
    limRamp(z0,z0+450,1);
    w.SIGNS.push({z:z0-80,kind:'board',side:1,lines:['ENTER',L.name]});
    w.SIGNS.push({z:z0+60,kind:'board',side:1,lines:['MERGE']});
  } else if(pv){
    limRamp(z0-50,z0+150,LT[ty].lim);
  }
  if(isLocal(ty)){
    const zs=(pv&&pv.type==='hwy')?z0+300:(pv?z0:z0-3000);
    w.ONC.push([zs,(nx&&nx.type==='hwy')?z1-150:z1]);
    genIntersections(L,pv,nx);
    if(ty!=='country') w.SIGNS.push({z:z0+30,kind:'welcome',side:1,lines:['WELCOME TO',L.place,'POP '+pop]});
  } else {
    genHwyLanes(z0+((pv&&isLocal(pv.type))?750:200),z1,nx);
  }
  genCurves(z0,z1,ty);
}
function buildTo(upto){
  const w=world;
  ensureLeg(0);
  for(;;){
    const i=w.legs.findIndex(L=>!L.built);
    if(i<0){ ensureLeg(w.legs.length); continue; }
    if(w.legs[i].z0>upto) break;
    buildLeg(i);
  }
}
function prune(pz){
  const lim=pz-900;
  const arrs=[world.CV,world.LIM,...Object.values(world.SW)];
  for(const a of arrs) while(a.length>4&&a[1][0]<lim) a.shift();
  while(world.ONC.length>1&&world.ONC[0][1]<lim) world.ONC.shift();
  while(world.INX.length&&world.INX[0].z<lim) world.INX.shift();
  while(world.SIGNS.length&&world.SIGNS[0].z<lim) world.SIGNS.shift();
}

function makeCar(o){
  const T=SPR[o.type];
  const c=Object.assign({ latV:0, accel:0, braking:false, cool:1+sim()*2, wanderT:4+sim()*10, planT:sim()*0.2,
                          forced:false, mergeWait:false, mergeDir:1, len:T.len, goal:o.slot, goalT:20,
                          player:false, dir:1, base:o.desired||40 }, o);
  c.lat=slotC(c.slot,c.z);
  return c;
}

// nearest same-direction car ahead in (roughly) the same lateral position
function gapAhead(c,lat){
  let best=1e9, bo=null;
  for(const o of cars){
    if(o===c||o.dir!==c.dir) continue;
    if(Math.abs(o.lat-lat)<0.75){
      const dz=(o.z-c.z)*c.dir;
      if(dz>0){ const g=dz-(c.len+o.len)/2; if(g<best){ best=g; bo=o; } }
    }
  }
  return [best,bo];
}
function safeToMove(c,s2,tight){
  const cen=slotC(s2,c.z), k=tight?0.5:1;
  for(const o of cars){
    if(o===c||o.dir!==c.dir) continue;
    if(!(Math.abs(o.lat-cen)<0.8 || o.slot===s2)) continue;
    const dz=o.z-c.z, half=(c.len+o.len)/2;
    const fr=(8+Math.max(0,c.v-o.v)*1.5)*k+half;
    const bk=(8+Math.max(0,o.v-c.v)*1.5)*k+half;
    if(dz>-bk && dz<fr) return false;
  }
  return true;
}
function setSlot(c,s2,forced){
  c.slot=s2;
  c.cool = forced ? 1 : (c.player ? 2.4 : 3.2+sim()*2);
}
function validSlots(z0,z1){
  const a=[]; for(let s=SMIN;s<=SMAX;s++) if(slotValid(s,z0,z1)) a.push(s); return a;
}
function pickGoal(c){
  const arr=validSlots(c.z,c.z+600);
  if(!arr.length) return c.slot;
  const far=arr.filter(s=>Math.abs(s-c.slot)>=2);
  const pool=(far.length&&sim()<0.7)?far:arr;
  return pool[(sim()*pool.length)|0];
}
function nearestSlot(c){
  let b=c.slot, bd=1e9;
  for(let s=SMIN;s<=SMAX;s++){
    if(evalSW(s,c.z)<0.3) continue;
    const d=Math.abs(slotC(s,c.z)-c.lat); if(d<bd){ bd=d; b=s; }
  }
  return b;
}

function plan(c){
  if(c.dir<0) return;
  if(c.player&&!autoPilot){ c.slot=nearestSlot(c); c.forced=false; return; }
  const look=Math.max(150,c.v*3.4);
  c.forced=false; c.mergeWait=false;
  // 1. is my lane about to disappear / turn oncoming?  -> step toward a lane that survives
  const doom=firstBadZ(c.slot,c.z,c.z+look);
  if(doom<Infinity){
    c.forced=true; c.mergeDist=doom-c.z;
    let best=null, bd=99;
    for(let s=SMIN;s<=SMAX;s++){
      if(s===c.slot||!slotValid(s,c.z,c.z+look+60)) continue;
      const d=Math.abs(s-c.slot); if(d<bd){ bd=d; best=s; }
    }
    if(best===null) return;
    const dir=Math.sign(best-c.slot);
    let s2=c.slot+dir;
    while(s2!==best&&evalSW(s2,c.z)<0.5) s2+=dir;     // hop over closed / pinched slots
    if(slotMinW(s2,c.z,c.z+50)<0.5){ c.mergeWait=true; return; }
    c.mergeDir=dir;
    if(safeToMove(c,s2,doom-c.z<30)) setSlot(c,s2,true); else c.mergeWait=true;
    return;
  }
  if(c.cool>0) return;
  // 2. blocked by a slower car / wandering / heading for goal lane
  const [gap,front]=gapAhead(c,c.lat);
  const blocked = !!front && gap<24+c.v*0.9 && front.v<c.desired-1.5;
  let dirs=[], goalDir=0;
  if(c.player){
    if(!slotValid(c.goal,c.z,c.z+look*1.5)) c.goal=pickGoal(c);
    goalDir=Math.sign(c.goal-c.slot);
    if(goalDir) dirs.push(goalDir);
    if(blocked) dirs.push(-1,1);
  } else if(blocked){
    dirs = sim()<0.5 ? [-1,1] : [1,-1];
  } else if(c.wanderT<=0){
    dirs=[sim()<0.5?-1:1]; c.wanderT=8+sim()*14;
  }
  let best=null, bestScore=-1e9;
  const seen=new Set();
  for(const dir of dirs){
    if(seen.has(dir)) continue; seen.add(dir);
    const s2=c.slot+dir;
    if(s2<SMIN||s2>SMAX) continue;
    if(!slotValid(s2,c.z,c.z+look*1.3)) continue;
    if(!safeToMove(c,s2)) continue;
    const [g2]=gapAhead(c,slotC(s2,c.z));
    const isGoal=c.player&&dir===goalDir;
    if(g2<30) continue;
    if(blocked && !isGoal && g2<gap+10) continue;
    const score=Math.min(g2,300)+(isGoal?400:0);
    if(score>bestScore){ bestScore=score; best=s2; }
  }
  if(best!==null) setSlot(c,best,false);
}

// speed cap needed to stop at the next red/yellow signal ahead (Infinity = none)
function signalCap(c){
  const L=world.INX;
  for(let i=0;i<L.length;i++){
    const x=L[i];
    if(!x.sig||x.z<c.z-3) continue;
    if(x.z>c.z+170) break;
    const st=sigState(x,totalT), dist=x.z-5-c.z;
    if(st==='G'||dist<-4) continue;
    if(st==='Y'&&c.v*c.v/12<dist*0.9&&false) continue;
    if(st==='Y'&&c.v*c.v/12>dist) continue;     // can't stop in time: run it
    return Math.sqrt(2*6*Math.max(0,dist));
  }
  return Infinity;
}


function updateCar(c,dt){
  const man=c.player&&!autoPilot;
  c.cool-=dt; c.wanderT-=dt; c.planT-=dt;
  if(c.player&&!man){ c.goalT-=dt; if(c.goalT<=0){ c.goal=pickGoal(c); c.goalT=18+sim()*16; } }
  if(c.planT<=0){ c.planT=0.16+sim()*0.1; plan(c); }
  const look=Math.max(40,c.v*2);
  const [gap,front]=gapAhead(c,c.lat);
  let adv;
  if(man){
    // manual: throttle / brake / coast
    const top=VMAX*0.98;
    let a = thrIn*9*CFG.speed - brkIn*18*CFG.speed - (thrIn||brkIn?0:1.5+c.v*0.012);
    if(c.v>=top&&a>0) a=0;
    c.v=Math.max(0,c.v+a*dt); c.accel=a; c.braking=brkIn>0.3||(a<-3);
    adv=c.v*dt;
  } else {
    let target;
    if(c.dir>0){
      c.desired=c.base*limAt(c.z+look)*(c.player?1:1);
      target=c.desired;
      const sc=signalCap(c); if(sc<target) target=sc;
      if(front){ const dg=6+c.v*0.42; if(gap<dg+30) target=Math.min(target,front.v+(gap-dg)*0.8); }
      if(c.mergeWait) target=Math.min(target,Math.max(0,c.v-18));
      if(c.cap!==undefined) target=Math.min(target,c.cap);
    } else {
      target=c.desired;
      if(front){ const dg=6+c.v*0.42; if(gap<dg+30) target=Math.min(target,front.v+(gap-dg)*0.8); }
    }
    target=Math.max(0,target);
    const a=clamp((target-c.v)*1.1,-14*CFG.speed,(c.player?5:4.5)*CFG.speed);
    c.v=Math.max(0,c.v+a*dt); c.accel=a; c.braking=a<-3;
    adv=c.v*dt;
  }
  // hard no-overlap: never advance into the car in front
  if(front&&c.dir>0&&!man){
    const room=Math.max(0,gap-1.2)+front.v*dt;
    if(adv>room){ adv=room; c.v=Math.min(c.v,front.v); }
  } else if(front&&c.dir<0){
    const room=Math.max(0,gap-1.2)+front.v*dt;
    if(adv>room){ adv=room; c.v=Math.min(c.v,front.v); }
  }
  c.z+=adv*c.dir;
  // lateral motion
  if(man){
    const [eL,eR]=roadEdges(c.z);
    const want=steerIn*1.7*Math.min(1,0.3+c.v/12);
    c.latV+=(want-c.latV)*Math.min(1,dt*7);
    c.lat=clamp(c.lat+c.latV*dt,eL+0.45,eR-0.45);
  } else {
    const tl=slotC(c.slot,c.z);
    const dv=clamp((tl-c.lat)*2.6,-1.4,1.4);
    c.latV+=(dv-c.latV)*Math.min(1,dt*6);
    c.lat+=c.latV*dt;
  }
}

function spawnCar(z,fast,onc){
  const p=player;
  if(onc){
    if(!(inOnc(z)&&inOnc(z+60))) return false;
    const cen=slotC(0,z);
    for(const o of cars) if(o.dir<0&&Math.abs(o.z-z)<55) return false;
    const type=sim()<0.15?'truck':sim()<0.3?'sports':'sedan';
    const lim=limAt(z), v=(26+sim()*30)*lim*CFG.speed;
    cars.push(makeCar({type,color:type==='truck'?'#d9e8d9':CAR_COLORS[(sim()*CAR_COLORS.length)|0],
      slot:0,z,v,desired:v,dir:-1}));
    return true;
  }
  const cands=validSlots(z,z+240);
  if(!cands.length) return false;
  const s=cands[(sim()*cands.length)|0];
  const cen=slotC(s,z);
  for(const o of cars) if(o.dir>0&&Math.abs(o.z-z)<48&&Math.abs(o.lat-cen)<0.9) return false;
  const r=sim();
  const type=r<0.16?'truck':r<0.36?'sports':'sedan';
  const lim=limAt(z);
  const v0=(fast?(76+sim()*22):(type==='truck'?(28+sim()*14):(34+sim()*34)))*CFG.speed;
  const v=v0*lim;
  const color=type==='truck'?'#d9e8d9':CAR_COLORS[(sim()*CAR_COLORS.length)|0];
  cars.push(makeCar({type,color,slot:s,z,v,desired:v,base:v0}));
  return true;
}
function trySpawn(){
  const p=player;
  const z=p.z+300;
  const L=legAt(z), ty=L?L.type:'hwy';
  let n=0,no=0;
  for(const c of cars) if(!c.player&&c.z>p.z-200&&c.z<p.z+700){ if(c.dir<0) no++; else n++; }
  const lanes=Math.max(1,validSlots(z,z+100).length);
  const cap=(ty==='hwy'?8+lanes*3:3+lanes*2.5)*CFG.traffic;
  if(n<cap){
    const behind=sim()<0.16;
    const zz=behind?(p.z-120-sim()*120):(p.z+560+sim()*160);
    spawnCar(zz,behind&&ty==='hwy',false);
  }
  if(no<6*CFG.traffic&&oncOverlap(p.z+300,p.z+700)) spawnCar(p.z+520+sim()*180,false,true);
}

let tripIdx=0;
function toast(m,s){ toastMsg=m; toastT=s||3; }

  for(let i=0;i<Math.round(40*CFG.traffic);i++) spawnCar(45+sim()*620,false,false);
  for(let i=0;i<5;i++) spawnCar(60+sim()*500,false,true);
  t=0; totalT=0; skyX=0; camL=player.lat; throttle=0.3; avgV=45; arrived=false; autoPilot=true;
  trip=world.trips[0];
  skySeed=CFG.sky!==null?CFG.sky:seed*7+3; initEnv(seed); buildSky();
}
function etaSecs(p){
  let s=0;
  for(const L of trip.legs){
    if(L.z1<=p.z) continue;
    const rem=L.z1-Math.max(p.z,L.z0);
    s+=rem/Math.max(6,50*CFG.speed*LT[L.type].lim);
  }
  return s;
}
function manualCollide(p){
  if(crashT>0) return;
  for(const o of cars){
    if(o===p) continue;
    const dz=o.z-p.z, half=(p.len+o.len)/2*0.9;
    if(Math.abs(dz)<half&&Math.abs(o.lat-p.lat)<0.55){

function update(dt){

  updEnv(dt);

  if(shakeT>0) shakeT-=dt;

  thrIn+=((keysDown.ArrowUp?1:0)-thrIn)*Math.min(1,dt*8);
  brkIn+=((keysDown.ArrowDown?1:0)-brkIn)*Math.min(1,dt*10);
  steerIn=(keysDown.ArrowRight?1:0)-(keysDown.ArrowLeft?1:0);

  // cruise speed target: wanders, slows in tight curves
  let des=60+28*Math.sin(t*0.11)+10*Math.sin(t*0.37+1);
  des=clamp(des,45,98)*CFG.speed;
  const kk=Math.abs(evalPL(world.CV,p.z+60));

  }

  for(const c of cars) updateCar(c,dt);

    if(c.player) return true;

// pick what stands in lot k on one side of the road
function lotAt(k,side,leg,dens){
  const id=((seedBase&0xffff)*131+k*2+(side>0?1:0))|0, r=salt=>hrand(seedBase,k*2+(side>0?1:0),salt);
  const ty=leg.type, q=r(1);
  let kind=null,w=6,h=4,gap=3;
  if(ty==='hwy'){
    if(dens>0.65&&q<0.35){ kind='bldg'; w=12+r(2)*10; h=10+r(3)*28; gap=5+r(4)*8; }
    else if(q<0.35){ kind=r(5)<0.4?'pine':'tree'; gap=3+r(4)*14; }
    else if(q<0.38){ kind='billboard'; gap=5; }
    else if(q<0.5&&dens<0.3){ kind='pole'; gap=3.5; }
  } else if(ty==='country'){
    if(q<0.4){ kind=r(5)<0.4?'pine':'tree'; gap=2+r(4)*9; }
    else if(q<0.52){ kind='fence'; gap=1.8; }
    else if(q<0.62){ kind='pole'; gap=1.6; }
    else if(q<0.66){ kind='barn'; gap=8+r(4)*6; }
    else if(q<0.69){ kind='silo'; gap=9; }
    else if(q<0.74){ kind='house'; w=9; gap=8+r(4)*6; }
  } else if(ty==='sub'){
    if(q<0.62){ kind='house'; w=8+r(2)*4; gap=5+r(4)*4; }
    else if(q<0.85){ kind=r(5)<0.3?'pine':'tree'; gap=3+r(4)*4; }
    else if(q<0.9){ kind='pole'; gap=1.8; }
  } else if(ty==='town'){
    if(q<0.68){ kind='shop'; w=9+r(2)*4; h=5.5+r(3)*3; gap=2.4; }
    else if(q<0.82){ kind='house'; w=9; gap=4.5; }
    else if(q<0.93){ kind='tree'; gap=2.2; }
  } else {
    if(q<0.88){ kind='bldg'; w=10+r(2)*8; h=9+r(3)*24; gap=2.2; }
    else if(q<0.95){ kind='shop'; w=10; h=6; gap=2.4; }
  }
  return kind?{kind,w,h,gap,v:r(6),id}:null;
}

function arrow(ox,oy,pts,c){
  for(let i=0;i<pts.length-1;i++){

    if(i===pts.length-2){
      const dx=x1-x0,dy=y1-y0,l=Math.hypot(dx,dy),ux=dx/l,uy=dy/l;
      tline(ox+x0,oy+y0,ox+x1-ux*4,oy+y1-uy*4,c);
      const tx=ox+x1,ty=oy+y1,bx=tx-ux*7,by=ty-uy*7,qx=-uy*4.5,qy=ux*4.5;

  const p=player;

/* ================================================================
   OFFLINE MP4 RENDER — ?render=seconds&fps=N
   Steps the sim with a fixed dt=1/fps and feeds every frame to a
   WebCodecs H.264 encoder as fast as the machine allows (nothing
   here is paced to wall-clock time), then muxes the samples into
   a plain .mp4 (ftyp/mdat/moov, avc1) and triggers a download.
   Requires WebCodecs (Chrome/Edge desktop). No libraries needed.
   ================================================================ */
const RENDER={ active:CFG.render>0 };
function vstat(html){
  let el=document.getElementById('vstat');
  if(!el){ el=document.createElement('div'); el.id='vstat'; wrap.appendChild(el); }
  el.innerHTML=html; return el;
}

/* --- @render-muxer: tiny MP4 writer (self-contained, testable) --- */
function mp4ascii(s){ const o=new Uint8Array(s.length); for(let i=0;i<s.length;i++) o[i]=s.charCodeAt(i)&255; return o; }
function mp4n(v,bytes){ v=Math.floor(v); if(v<0) v+=4294967296; const o=new Uint8Array(bytes);
  for(let i=bytes-1;i>=0;i--){ o[i]=v%256; v=(v-o[i])/256; } return o; }
const mp4U16=v=>mp4n(v,2), mp4U32=v=>mp4n(v,4), mp4I32=v=>mp4n(v|0,4);
function mp4box(type,parts){
  let len=8; for(const p of parts) len+=p.length;
  const out=new Uint8Array(len), dv=new DataView(out.buffer);
  dv.setUint32(0,len);
  out[4]=type.charCodeAt(0); out[5]=type.charCodeAt(1); out[6]=type.charCodeAt(2); out[7]=type.charCodeAt(3);
  let o=8; for(const p of parts){ out.set(p,o); o+=p.length; }
  return out;
}
// frames: [{data:Uint8Array (AVCC length-prefixed H.264), key:bool, pts:int (timescale units)}]
// in decode(=callback) order. avcC: Uint8Array AVCDecoderConfigurationRecord.
function muxMP4(frames,avcC,FPS){
  const TS=Math.round(FPS*1000), DUR=1000, n=frames.length;
  // Decode times are regular (fixed fps output order); composition offsets
  // are relative to the first frame so the clip starts at 0. Baseline H.264
  // never reorders, so ctts below is normally all zeros and gets omitted.
  const p0=frames[0].pts;
  let cttsNeed=false;
  for(let i=0;i<n;i++){ const c=frames[i].pts-p0-i*DUR; frames[i].ctts=c; if(c!==0) cttsNeed=true; }
  // --- sample layout inside mdat ---
  let dataLen=0; for(const f of frames) dataLen+=f.data.length;
  const mdatH=(8+dataLen<0xFFFFFFFF)
    ? [mp4U32(8+dataLen),mp4ascii('mdat')]
    : [mp4U32(1),mp4ascii('mdat'),mp4U32(Math.floor((8+dataLen)/4294967296)),mp4U32((8+dataLen)%4294967296)];
  let hlen=0; for(const p of mdatH) hlen+=p.length;
  const offs=new Array(n); let pos=0;
  for(let i=0;i<n;i++){ offs[i]=pos; pos+=frames[i].data.length; }
  const MAT=[mp4U32(0x10000),mp4U32(0),mp4U32(0),mp4U32(0),mp4U32(0x10000),mp4U32(0),mp4U32(0),mp4U32(0),mp4U32(0x40000000)];
  const ftyp=mp4box('ftyp',[mp4ascii('isom'),mp4U32(0x200),mp4ascii('isom'),mp4ascii('iso2'),mp4ascii('avc1'),mp4ascii('mp41')]);
  const mdatOff=ftyp.length+hlen;
  const mvhd=mp4box('mvhd',[mp4n(0,1),mp4n(0,3),mp4U32(0),mp4U32(0),mp4U32(TS),mp4U32(n*DUR),
    mp4U32(0x10000),mp4U16(0x100),mp4U16(0),mp4U32(0),mp4U32(0),
    ...MAT,mp4U32(0),mp4U32(0),mp4U32(0),mp4U32(0),mp4U32(0),mp4U32(0),mp4U32(2)]);
  const tkhd=mp4box('tkhd',[mp4n(0,1),mp4n(0,3),mp4U32(0),mp4U32(0),mp4U32(1),mp4U32(0),mp4U32(n*DUR),mp4U32(0),mp4U32(0),
    mp4n(0,2),mp4n(0,2),mp4U16(0),mp4U16(0),...MAT,mp4U32(W*65536),mp4U32(H*65536)]);
  const mdhd=mp4box('mdhd',[mp4n(0,1),mp4n(0,3),mp4U32(0),mp4U32(0),mp4U32(TS),mp4U32(n*DUR),mp4U16(0x55C4),mp4U16(0)]);
  const hdlr=mp4box('hdlr',[mp4n(0,1),mp4n(0,3),mp4U32(0),mp4ascii('vide'),mp4U32(0),mp4U32(0),mp4U32(0),mp4ascii('VideoHandler\0')]);
  const vmhd=mp4box('vmhd',[mp4n(0,1),mp4n(1,3),mp4U16(0),mp4U16(0),mp4U16(0),mp4U16(0)]);
  const dref=mp4box('dref',[mp4n(0,1),mp4n(0,3),mp4U32(1),mp4box('url ',[mp4n(0,1),mp4n(1,3)])]);
  const cname=new Uint8Array(32); // empty pascal-string compressor name
  const avc1=mp4box('avc1',[new Uint8Array(6),mp4U16(1),mp4U16(0),mp4U16(0),mp4U32(0),mp4U32(0),mp4U32(0),
    mp4U16(W),mp4U16(H),mp4U32(0x480000),mp4U32(0x480000),mp4U32(0),mp4U16(1),cname,mp4U16(0x18),mp4n(-1,2),
    mp4box('avcC',[avcC])]);
  const stsd=mp4box('stsd',[mp4n(0,1),mp4n(0,3),mp4U32(1),avc1]);
  const stts=mp4box('stts',[mp4n(0,1),mp4n(0,3),mp4U32(1),mp4U32(n),mp4U32(DUR)]);
  const stblKids=[stsd,stts];
  if(cttsNeed){
    const cparts=[mp4n(1,1),mp4n(0,3),mp4U32(n)];
    for(let i=0;i<n;i++){ cparts.push(mp4U32(1),mp4I32(frames[i].ctts)); }
    stblKids.push(mp4box('ctts',cparts));
  }
  const syncs=[]; for(let i=0;i<n;i++) if(frames[i].key) syncs.push(mp4U32(i+1));
  stblKids.push(mp4box('stss',[mp4n(0,1),mp4n(0,3),mp4U32(syncs.length),...syncs]));
  stblKids.push(mp4box('stsc',[mp4n(0,1),mp4n(0,3),mp4U32(1),mp4U32(1),mp4U32(1),mp4U32(1)])); // 1 sample/chunk
  const sizes=[]; for(const f of frames) sizes.push(mp4U32(f.data.length));
  stblKids.push(mp4box('stsz',[mp4n(0,1),mp4n(0,3),mp4U32(0),mp4U32(n),...sizes]));
  const co=[]; for(let i=0;i<n;i++) co.push(mp4U32(offs[i]+mdatOff));
  stblKids.push(mp4box('stco',[mp4n(0,1),mp4n(0,3),mp4U32(n),...co]));
  const moov=mp4box('moov',[mvhd,mp4box('trak',[tkhd,mp4box('mdia',[mdhd,hdlr,mp4box('minf',[vmhd,mp4box('dinf',[dref]),mp4box('stbl',stblKids)])])])]);
  const parts=[ftyp,...mdatH];
  for(const f of frames) parts.push(f.data);
  parts.push(moov);
  let total=0; for(const p of parts) total+=p.length;
  const out=new Uint8Array(total); let o=0;
  for(const p of parts){ out.set(p,o); o+=p.length; }
  return out;
}
/* --- end @render-muxer --- */

const RENDER_CODECS=['avc1.42E01E','avc1.4D401F','avc1.640028']; // baseline first: never reorders (B-frames impossible)
async function renderVideo(){
  const fps=CFG.fps, total=Math.min(500000,Math.max(1,Math.round(CFG.render*fps)));
  if(typeof VideoEncoder==='undefined'||typeof VideoFrame==='undefined'){ vstat('RENDER FAILED: NO WEBCODECS (TRY CHROME/EDGE)'); return; }
  vstat('RENDER 0% · PROBING ENCODER');
  let codec=null;
  for(const c of RENDER_CODECS){
    try{
      const s=await VideoEncoder.isConfigSupported({codec:c,width:W,height:H,bitrate:800000,framerate:fps,avc:{format:'avc'}});
      if(s.supported){ codec=c; break; }
    }catch(e){/* try next */}
  }
  if(!codec){ vstat('RENDER FAILED: NO H.264 ENCODER'); return; }
  paused=false; // frames must advance even with ?pause=1
  const bitrate=Math.min(20000000,Math.max(500000,Math.round(W*H*fps*0.15)));
  const TS=Math.round(fps*1000);
  const frames=[]; let avcC=null, encErr=null;
  const enc=new VideoEncoder({
    output:(chunk,meta)=>{
      const buf=new Uint8Array(chunk.byteLength); chunk.copyTo(buf);
      if(meta&&meta.decoderConfig&&meta.decoderConfig.description) avcC=new Uint8Array(meta.decoderConfig.description);
      frames.push({data:buf,key:chunk.type==='key',pts:Math.round(chunk.timestamp*TS/1e6)});
    },
    error:e=>{ encErr=e; },
  });
  enc.configure({codec,width:W,height:H,bitrate,framerate:fps,avc:{format:'avc'},latencyMode:'quality'});
  const dt=1/fps, keyEvery=Math.max(1,Math.round(fps));
  const waitDq=()=>new Promise(res=>{ const h=()=>{ enc.removeEventListener('dequeue',h); res(); }; enc.addEventListener('dequeue',h); });
  for(let i=0;i<total&&!encErr;i++){
    if(enc.encodeQueueSize>6) await waitDq();       // backpressure only; never paced to realtime
    update(dt); render();
    const vf=new VideoFrame(cv,{timestamp:Math.round(i*1e6/fps)});
    enc.encode(vf,{keyFrame:i%keyEvery===0});
    vf.close();
    if(i%15===0){ vstat('RENDER '+Math.round(i/total*100)+'% · '+i+'/'+total+'F @ '+fps+'FPS'); await new Promise(r=>setTimeout(r,0)); }
  }
  if(!encErr) await enc.flush();
  try{ enc.close(); }catch(e){}
  if(encErr){ vstat('RENDER FAILED: '+String((encErr&&encErr.message)||encErr).slice(0,120).toUpperCase()); return; }
  if(!frames.length||!avcC){ vstat('RENDER FAILED: ENCODER RETURNED NO DATA'); return; }
  const mp4=muxMP4(frames,avcC,fps);
  const blob=new Blob([mp4],{type:'video/mp4'});
  const url=URL.createObjectURL(blob);
  const fname='night-run_'+CFG.render+'s_'+fps+'fps.mp4';
  const a=document.createElement('a'); a.href=url; a.download=fname; document.body.appendChild(a); a.click(); a.remove();
  vstat('DONE · '+frames.length+'F · '+(mp4.length/1048576).toFixed(1)+'MB · <a href="'+url+'" download="'+fname+'">SAVE '+fname.toUpperCase()+'</a>');
}

function setTheme(i){ themeIdx=((i%THEMES.length)+THEMES.length)%THEMES.length; updPalette(); buildSky(); }
function toggleAuto(){
  autoPilot=!autoPilot;
  const p=player;
  if(autoPilot){ p.slot=nearestSlot(p); p.goal=p.slot; p.cool=1; p.latV=0; toast('AUTOPILOT ON',2); }
  else { p.cap=undefined; toast('MANUAL: ARROWS TO DRIVE',3); }
}
const ARROWS=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
window.addEventListener('keydown',e=>{
  if(RENDER.active) return; // off the gas while rendering
  if(ARROWS.includes(e.key)){ keysDown[e.key]=true; e.preventDefault(); return; }
  const k=e.key.toLowerCase();
  if(k===' '){ paused=!paused; e.preventDefault(); }
  else if(k==='u') units=units==='mph'?'kmh':'mph';
  else if(k==='c') setTheme(themeIdx+1);
  else if(k==='s') wrap.classList.toggle('scan');
  else if(k==='r'){ seedPinned=true; init((Math.random()*1e9)|0); }
  else if(k==='m') toggleAuto();
  else if(k==='t'){ ENV.time=TIME_MODES[(TIME_MODES.indexOf(ENV.time)+1)%TIME_MODES.length]; toast('TIME: '+ENV.time.toUpperCase(),2); }
  else if(k==='w'){
    ENV.wx=WX_MODES[(WX_MODES.indexOf(ENV.wx)+1)%WX_MODES.length];
    if(ENV.wx==='live'){ ENV.live=null; fetchLive(); } else if(ENV.wx==='sim') simWeather();
    toast('WEATHER: '+ENV.wx.toUpperCase(),2);
  }
  else return;
  syncURL();
});
window.addEventListener('keyup',e=>{ if(ARROWS.includes(e.key)) delete keysDown[e.key]; });
window.addEventListener('blur',()=>{ for(const k of ARROWS) delete keysDown[k]; });
cv.addEventListener('click',()=>{ units=units==='mph'?'kmh':'mph'; syncURL(); });

let last=0;
function frame(ts){
  const dt=Math.min(0.05,((ts-last)/1000)||0.016); last=ts;
  if(!paused) update(dt);
  render();
  requestAnimationFrame(frame);
}
init(CFG.seed!==null?CFG.seed:((Math.random()*1e9)|0));
zc=player.z-7;
syncURL();
if(RENDER.active) renderVideo();   // ?render=N: export mp4 instead of playing live
else requestAnimationFrame(frame);
/*@@DEBUG*/
})();
</script>
